# Nixpacks Konfiguration für WebWelle
# Stellt sicher, dass lightningcss native Binaries installiert werden

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm ci",
  "npm install --include=optional lightningcss",
  "npm rebuild lightningcss --force"
]

[phases.build]
cmds = [
  "npm run build"
]

[phases.start]
cmd = "npm start"

