# Nixpacks Konfiguration für WebWelle
# Stellt sicher, dass lightningcss native Binaries installiert werden

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm ci --include=optional",
  "npm install --force --include=optional lightningcss@1.30.1 || true",
  "npm rebuild lightningcss --force || true"
]

[phases.build]
cmds = [
  "npm run build"
]

[phases.start]
cmd = "npm start"

